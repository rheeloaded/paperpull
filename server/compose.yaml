# PaperPull Server, as a Docker Compose project.
#
#   docker compose -f server/compose.yaml up -d
#
# Then open http://<this machine's address>:8765 from a browser on your home
# network. The first visit asks you to choose a password, with the setup
# code the container prints in its log (docker logs paperpull). The panel
# and the browser screen the sign-in windows open on are both behind that
# password, on that one port.
#
# Keep the port to your home network. Reach it from outside through your
# own VPN, never by forwarding the port on your router.
#
#   docker exec paperpull python /opt/paperpull/server/selftest.py
name: paperpull
services:
  paperpull:
    # Published by every PaperPull release, one tag per version, so the
    # version you run changes only when you change this line. To update,
    # write the newer version here, see "Updating" in SERVER.md. For an
    # image built with server/build.py, write paperpull-server:dev instead.
    image: ghcr.io/rheeloaded/paperpull-server:0.59.2
    container_name: paperpull
    init: true
    # Time for the sign-in browsers to close properly and keep their sessions.
    stop_grace_period: 30s
    # Chrome draws pages in shared memory, and Docker's default is too small.
    shm_size: "2gb"
    # If this machine has Intel or AMD graphics, remove the # from the next
    # two lines. The sign-in window then draws on the graphics chip, and
    # without it some sites, Best Buy among them, refuse a sign-in from the
    # server. Leave them as they are on a machine with no /dev/dri, since
    # Docker will not start a container that names a missing device. See
    # "Graphics" in SERVER.md.
    #devices:
    #  - /dev/dri:/dev/dri
    # Chrome's own sandbox needs the container to allow user namespaces,
    # which Docker's default security profile forbids. This profile is
    # Docker's default with that one thing allowed, see seccomp-chrome.json.
    security_opt:
      - seccomp=./seccomp-chrome.json
    # On a NAS whose kernel has seccomp but no user namespaces, Chrome's usual
    # sandbox cannot start and the sign-in window is refused, as it should
    # be. Remove the # from the next two lines and Chrome uses its setuid
    # sandbox instead, which builds the same sandbox without user namespaces.
    # The sandbox stays on either way. This is not --no-sandbox, and not
    # privileged. "On Synology" in SERVER.md says how to tell, and
    # which kernels cannot run PaperPull Server at all.
    #cap_add:
    #  - SYS_ADMIN
    ports:
      - "8765:8765"
    environment:
      TZ: America/New_York
      # The NAS user and group the saved documents should belong to.
      PUID: "1000"
      PGID: "1000"
      # To choose the password here instead of on the first visit, at least
      # ten characters. Only its hash is kept, so it can come out of this
      # file once the container has started with it.
      # PAPERPULL_PASSWORD: "choose one"
      # The panel answers to this machine's address and to a name that
      # exists only on your home network, such as nas or nas.local. To
      # reach it by any other name, a VPN's or a reverse proxy's, list the
      # names here, separated by commas.
      # PAPERPULL_HOSTS: "paperpull.example.com"
      # 1 makes the panel answer only to the names and addresses listed in
      # PAPERPULL_HOSTS, and no longer to this machine's address or a home
      # network name unless they are listed there too.
      # PAPERPULL_HOSTS_ONLY: "1"
      # With Paperless, 1 puts each provider's documents in a folder of the
      # provider's name inside the consume folder, which Paperless turns into
      # a tag when PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS is on there.
      # PAPERLESS_SUBFOLDERS: "1"
    volumes:
      # Each provider's folder, its documents, records and logs. A shared
      # folder on a NAS, so the documents can be opened and imported.
      - ./data:/data
      # The signed-in browser profiles. Kept out of the shared folder.
      - profiles:/profiles
      # The server's own settings and its password's hash.
      - settings:/config
      # Chrome, downloaded from Google at the first start.
      - browser:/browser
      # Paperless's consume folder, if you use Paperless. Each run's new
      # documents are copied into it, and PaperPull keeps its own copies.
      # Leave this out and nothing is copied.
      # - /path/to/paperless/consume:/paperless
    restart: unless-stopped
volumes:
  profiles:
  settings:
  browser:
