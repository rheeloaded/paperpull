# PaperPull Server, as a Docker Compose project. EXPERIMENTAL.
#
#   docker compose -f server/compose.yaml up -d
#
# Then open http://<this machine's address>:8765 from a browser on your home
# network. The first visit asks you to choose a password, with the setup
# code the container prints in its log (docker logs paperpull). The panel
# and the browser screen the sign-in windows open on are both behind that
# password, on that one port.
#
# Keep the port to your home network. Reach it from outside through your
# own VPN, never by forwarding the port on your router.
#
#   docker exec paperpull python /opt/paperpull/server/selftest.py
name: paperpull
services:
  paperpull:
    image: paperpull-server:dev
    container_name: paperpull
    init: true
    # Time for the sign-in browsers to close properly and keep their sessions.
    stop_grace_period: 30s
    # Chrome draws pages in shared memory, and Docker's default is too small.
    shm_size: "2gb"
    # Chrome's own sandbox needs the container to allow user namespaces,
    # which Docker's default security profile forbids. This profile is
    # Docker's default with that one thing allowed, see seccomp-chrome.json.
    security_opt:
      - seccomp=./seccomp-chrome.json
    ports:
      - "8765:8765"
    environment:
      TZ: America/New_York
      # The NAS user and group the saved documents should belong to.
      PUID: "1000"
      PGID: "1000"
      # To choose the password here instead of on the first visit, at least
      # ten characters. Only its hash is kept, so it can come out of this
      # file once the container has started with it.
      # PAPERPULL_PASSWORD: "choose one"
      # With Paperless, 1 puts each provider's documents in a folder of the
      # provider's name inside the consume folder, which Paperless turns into
      # a tag when PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS is on there.
      # PAPERLESS_SUBFOLDERS: "1"
    volumes:
      # Each provider's folder, its documents, records and logs. A shared
      # folder on a NAS, so the documents can be opened and imported.
      - ./data:/data
      # The signed-in browser profiles. Kept out of the shared folder.
      - profiles:/profiles
      # The server's own settings and its password's hash.
      - settings:/config
      # Chrome, downloaded from Google at the first start.
      - browser:/browser
      # Paperless's consume folder, if you use Paperless. Each run's new
      # documents are copied into it, and PaperPull keeps its own copies.
      # Leave this out and nothing is copied.
      # - /path/to/paperless/consume:/paperless
    restart: unless-stopped
volumes:
  profiles:
  settings:
  browser:
