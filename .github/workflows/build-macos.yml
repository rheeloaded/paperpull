# Builds the macOS bundle and disk image twice, arm64 on a clean Apple
# Silicon runner and x86_64 on a clean Intel one (#88), signs each with the
# Developer ID certificate held in the repository's secrets, has Apple
# notarize it, and staples the ticket on. The two run side by side, so the
# Intel build runs alongside the other rather than after it, and each is
# smoke-tested on the hardware it is for.
#
# When the certificate secret is absent the signing steps skip themselves
# and the dmg is unsigned, so a fork without the secrets still builds.
#
# Nothing here publishes. The artifacts sit on the workflow run until a
# person runs tools/release.sh, which checks them and makes the release.

name: macOS package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}

jobs:
  build:
    strategy:
      # One failing does not cancel the other. tools/release.sh publishes
      # only from a run that succeeded with both dmgs, so after a failed leg
      # the way on is "Re-run failed jobs" on this run, which builds that
      # leg again and leaves the one that passed alone. If a dmg is still
      # missing after that, release.sh names it and "Re-run all jobs" is
      # the fallback.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Confirm the runner is ${{ matrix.arch }}
        run: |
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"

      # A keychain that exists only for this job. The certificate is decoded
      # into it, the identity's name is read back out for codesign, and the
      # decoded file is removed at once. The keychain itself is deleted in the
      # last step, whether or not the build succeeded.
      - name: Import the signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "signing as: ${IDENTITY%% (*}"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the notarization key
        if: env.HAVE_CERT == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        if: env.HAVE_CERT == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: python packaging/build_macos.py --sign --arch ${{ matrix.arch }}

      - name: Build unsigned (no certificate in this repository)
        if: env.HAVE_CERT != 'true'
        run: python packaging/build_macos.py --arch ${{ matrix.arch }}

      - name: Prove the panel starts from the bundle
        run: |
          export PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
          RES=dist/PaperPull.app/Contents/Resources
          want="$(python -c 'import sys; sys.path.insert(0, "packaging"); import build_macos; print(build_macos.PY_VERSION)')"
          have="$("$RES/python/bin/python3" -c 'import platform; print(platform.python_version())')"
          echo "the bundle runs Python $have, and the build names $want"
          test "$have" = "$want"
          "$RES/python/bin/python3" -m uvicorn app:app --host 127.0.0.1 --port 8765 --app-dir "$RES/gui" &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fs -H "Origin: http://127.0.0.1:8765" http://127.0.0.1:8765/api/providers > providers.json; then break; fi
          done
          python3 -c "import json; d=json.load(open('providers.json'))['providers']; print(len(d), 'providers'); assert len(d) >= 26"
          curl -fs http://127.0.0.1:8765/ | grep -o 'v0\.[0-9][^<]*' | head -1
          kill %1

      # The step above runs the bundle's Python by hand. This one runs the
      # bundle's own main executable, the native launcher that a person
      # double-clicks, in its "ready" self-test: it starts the panel exactly
      # as the app does, waits for GET / to answer 200, prints one READY line
      # and stops the panel. That proves the compiled Mach-O, of this
      # runner's architecture, finds the bundled Python and starts the panel,
      # which the step above cannot. This is the hard gate. It runs after
      # the build step, so on a signed build it is the signed executable
      # that runs. The port is the launcher's own choice (8765, or a free
      # one), so the line is read for its address, not compared with a
      # fixed one.
      - name: Prove the app's own executable starts the panel
        run: |
          export PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
          lipo -archs dist/PaperPull.app/Contents/MacOS/PaperPull
          test "$(lipo -archs dist/PaperPull.app/Contents/MacOS/PaperPull)" = "${{ matrix.arch }}"
          # macOS has no timeout(1), so the self-test is given 90 s by a
          # watchdog; the launcher gives up by itself after 60 s.
          PAPERPULL_LAUNCHER_SELFTEST=ready dist/PaperPull.app/Contents/MacOS/PaperPull > ready.out 2> ready.err &
          pid=$!
          ( sleep 90; kill "$pid" ) > /dev/null 2>&1 &
          watchdog=$!
          status=0
          wait "$pid" || status=$?
          kill "$watchdog" 2>/dev/null || true
          cat ready.out
          cat ready.err >&2
          test "$status" = 0
          grep -Eq '^READY http://127\.0\.0\.1:[0-9]+$' ready.out

      # The step above creates no window and no web view, so on its own it
      # says nothing about WebKit or the plist's App Transport Security key.
      # This one runs the same signed executable in "window" mode, which
      # builds the window and the WKWebView, loads the panel into it and
      # prints one WINDOW line once the page has loaded. It is allowed to
      # fail, visibly: a hosted macOS runner may have no window server
      # session, so a failure here can mean "no display" and not "broken
      # app". It stays in the workflow so that whenever a runner can show a
      # window, a launcher that cannot is seen on the run, as a failed step
      # with the job still green, rather than not at all.
      - name: Prove the app's own executable opens its window (may fail on a headless runner)
        continue-on-error: true
        run: |
          export PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
          lipo -archs dist/PaperPull.app/Contents/MacOS/PaperPull
          test "$(lipo -archs dist/PaperPull.app/Contents/MacOS/PaperPull)" = "${{ matrix.arch }}"
          # Same watchdog as above: 90 s, then the launcher is killed.
          PAPERPULL_LAUNCHER_SELFTEST=window dist/PaperPull.app/Contents/MacOS/PaperPull > window.out 2> window.err &
          pid=$!
          ( sleep 90; kill "$pid" ) > /dev/null 2>&1 &
          watchdog=$!
          status=0
          wait "$pid" || status=$?
          kill "$watchdog" 2>/dev/null || true
          cat window.out
          cat window.err >&2
          test "$status" = 0
          grep -Eq '^WINDOW title=PaperPull$' window.out

      - name: What Gatekeeper will say
        if: env.HAVE_CERT == 'true'
        # stapler validate asks Apple's ticket server too, which dropped the
        # connection (exit 68) on the Intel runner as 0.56.0 was built. Each
        # validate is tried four times, 15, 30 and 60 s apart, the waits of
        # STAPLE_WAITS in packaging/build_macos.py, and the step still fails
        # with stapler's own exit code when the last try does.
        run: |
          validate() {
            for wait in 15 30 60; do
              xcrun stapler validate "$@" && return 0
              echo "stapler validate exited $?, trying again in $wait s"
              sleep "$wait"
            done
            xcrun stapler validate "$@"
          }
          codesign --verify --strict --verbose=2 dist/PaperPull.app
          spctl --assess --type execute --verbose=2 dist/PaperPull.app
          validate dist/PaperPull.app
          validate dist/PaperPull-*.dmg

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 PaperPull-*.dmg | tee SHA256SUMS.txt

      - name: Upload the disk image and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PaperPull-macos-${{ matrix.arch }}
          path: |
            dist/PaperPull-*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove the signing keychain and key
        if: always() && env.HAVE_CERT == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${MACOS_KEYCHAIN:-}" ] && [ -f "$MACOS_KEYCHAIN" ]; then
            security delete-keychain "$MACOS_KEYCHAIN"
          fi
