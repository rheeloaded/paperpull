# Runs every test in the repository.
#
# Nothing did, before this. Four thousand tests lived here and the only
# workflows were the two that package a release, so whether a tag shipped
# with a passing suite depended on the person cutting it remembering to run
# one. A release cannot be the first time the tests are asked.
#
# It runs on a push to main, on a pull request, and on a version tag, so the
# packaging workflows and this one both answer for the same commit.
#
# The suites are split into six parts that run on six runners at once.
# On one runner the suite grew from 37 minutes on 2026-09-27 to 82 by
# 2026-10-03, and twice a run that passed every test was cut off by the job
# limit and ended CANCELLED. Each part is balanced by tools/suite_times.json,
# and the job named "tests" answers for all six, as the single job did.
#
# There were four parts until 2026-10-11. By then the suites took about
# 8,500 s on CI, so even an even split of four was 35 minutes of tests a
# part and 39 with setup, and a slow runner took core's part past the limit
# (69d43fa8, cancelled at 45 minutes with nothing failed). Six parts
# planned at about 24 minutes of tests each, so a part had room for a
# runner half again as slow, and for the suites to grow.
#
# By 2026-10-18 the suites took about 11,000 s on CI, and six parts plan at
# about 31 minutes of tests each. Part 1 of the 0.56.0 tag was canceled at
# the limit with nothing failed, planned from times that had fallen behind
# CI's own, which tools/suite_times.json holds since. Core alone took 27 to
# 38 minutes of its part in five runs, and more parts cannot shorten the
# part that holds it, since core is one suite. So the same day the
# censuses left core for a suite of their own, core-censuses, beside
# core-browsers (tools/pytest_plugins/core_part.py). No suite is planned at
# more than about 16 minutes now. Replayed on those five runs' own times,
# core's divided as runs here divided it, each part's median is 32.0 to
# 32.8 minutes with setup, about as short as six parts can be, and its
# longest 32.5 to 36.5, against 40 for the part that held core whole on
# the slowest of those runners.
#
# The runner's own tests also run on Linux and macOS, and "tests" answers
# for them too. The parts run on Windows, where the runner's POSIX branches
# (process groups, fcntl locks, signals) never run. On 2026-10-03 one of
# them was found ending the runner and every suite the first time a suite
# ran out of time on macOS or Linux, and nothing here had ever run it.
# Every shell script is read by bash there as well, by /bin/bash 3.2 on
# macOS, the bash a Mac runs a .command with.
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  part:
    name: tests part ${{ matrix.part }} of 6
    runs-on: windows-latest
    # A guard against a run that hangs, not a budget. A part takes about a
    # sixth of the whole.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what every suite needs
        # A missing library here does not fail a suite, it makes the suite
        # skip itself quietly, which is the thing this workflow exists to
        # stop. The runner below refuses to pass while the privacy canary
        # is one of the skips. The packages come from the Windows package's
        # own lock, every file checked against its hash, so the suites run
        # on exactly the versions the package ships and tools/release.sh
        # waits for a run of them. pytest is the one thing the package does
        # not carry, and the core is built with the lock's setuptools.
        # pytest is pinned to the version the suites run on here, since the
        # runner reads pytest's output, and 9.2.0 (2026-10-27) prints each
        # failure under two paths and failed the runner's own tests.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-windows-x64.txt
          python -m pip install pytest==9.1.1
          python -m pip install --no-deps --no-build-isolation ./core

      - name: Install the browser the privacy canary needs
        # Without --with-deps. On Windows that installs the Media Foundation
        # feature, about 3 minutes of every part on 2026-10-11 against 15 s
        # for the browser itself, and no test plays audio or video.
        run: python -m playwright install chromium

      - name: Run this part of the suites
        # A failing suite prints each failure with every frame of its
        # traceback, then its whole pytest output in a group below that
        # opens with a click. The log is all there is of a CI run, and a
        # failure that does not come back on a rerun has to be explained
        # from it.
        run: python tools/run_all_tests.py --shard ${{ matrix.part }}/6 --jobs 1

  posix:
    name: the runner on ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    # A guard against a run that hangs. The tests take about a minute.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both, since stop_tree reads the process tree from /proc on Linux
        # and from ps on macOS, so each runs a branch the other does not.
        include:
          - os: ubuntu-latest
            system: linux
          - os: macos-latest
            system: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest
        # These tests need nothing else. Each fake suite they start runs in
        # a pytest of its own and imports only the standard library. The
        # same pytest as the suites above, since these tests read its output.
        run: python -m pip install pytest==9.1.1

      - name: Run the runner's own tests
        # Verbose, so the log names every test that ran here. A test that
        # only means something on POSIX skips itself on Windows, so this is
        # the one place it runs.
        run: python -m pytest core/tests/test_run_all_tests_parallel.py core/tests/test_run_all_tests_tool.py -v -rs

      - name: Check that every shell script parses
        # The parts have only Git's bash. A Mac runs a .command with
        # /bin/bash, which is 3.2, so this reads every script with that bash
        # too, and with the newer one PATH finds. setup-all.command did not
        # parse from 0.19.0 to 0.43.0 and nothing here asked bash to read it.
        run: >-
          python -m pytest -v -rs
          core/tests/test_double_click_files.py::test_every_shell_script_parses
          core/tests/test_double_click_files.py::test_the_parse_check_names_an_if_with_nothing_left_in_it

  tests:
    # One check for the whole run, under the name the single job had. It
    # answers for the parts and for the runner on Linux and macOS.
    needs: [part, posix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed, and the runner on linux and macos
        run: |
          echo "the parts ended ${{ needs.part.result }}, the runner on linux and macos ${{ needs.posix.result }}"
          test "${{ needs.part.result }}" = "success"
          test "${{ needs.posix.result }}" = "success"
