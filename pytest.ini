; Running two suites in one command used to stop before any test ran.
;
;     pytest core/tests gui/tests
;     ERROR collecting test_scope.py
;     import file mismatch
;
; There is a test_scope.py in both, neither directory is a package, so
; pytest imported one and then refused the other because the module name
; was taken. A hard collection error, no tests run, and the answer is a
; paragraph about __pycache__ that sends you looking in the wrong place.
;
; tools/run_all_tests.py never hit it, because it runs each suite in its
; own pytest, which is also why CI stayed green. So the only person who
; met this was somebody running the tests the obvious way, which is the
; one person a test suite most needs to keep.
;
; importlib gives each file its own module identity, so two files may
; share a name. It is the import mode pytest recommends for new projects
; and will default to in pytest 9.
[pytest]
addopts = --import-mode=importlib
