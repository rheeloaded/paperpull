[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpull-core"
version = "0.1.6"
description = "Shared storage, PDF and classification core for the PaperPull downloaders"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "rheeloaded" }]
dependencies = [
    # [crypto] pulls in `cryptography`, without which pypdf cannot open an
    # AES-encrypted PDF - some providers (USAA insurance documents, for one)
    # hand those out, and they would otherwise fail validation forever.
    "pypdf[crypto]>=4.0",
]

# What the test suite needs beyond the runtime dependency. Without these
# several suites SKIP themselves rather than fail, and one of them is the
# privacy canary, the only test holding the promise that a failure file
# carries no page content. tools/run_all_tests.py refuses to report success
# when that one is among the skips.
[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "playwright>=1.44",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[project.urls]
Homepage = "https://github.com/rheeloaded/paperpull"

[tool.setuptools]
packages = ["paperpull_core"]
