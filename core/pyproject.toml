[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpull-core"
version = "0.1.0"
description = "Shared storage, PDF and classification core for the PaperPull downloaders"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rheeloaded" }]
dependencies = [
    "pypdf>=4.0",
]

[project.urls]
Homepage = "https://github.com/rheeloaded/paperpull"

[tool.setuptools]
packages = ["paperpull_core"]
